[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Serve the sitemap at the conventional /sitemap.xml path too
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 200
  force = true

# Canonical URLs have no trailing slash
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301
  force = true
